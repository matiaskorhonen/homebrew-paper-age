name: Homebrew Formula

on:
  repository_dispatch:
    types: ["Update Homebrew Formula"]
  workflow_dispatch:
    inputs:
      version:
        description: "PaperAge release version (e.g. 1.2.3)"
        required: true
  push:
    # Not tags: the release run pushes one, and there's nothing to test then
    branches: ["**"]

permissions:
  # For gitsign. Commits and tags are pushed with the GitHub App token, so
  # GITHUB_TOKEN only needs to read.
  id-token: write
  contents: read

# Queue release runs so two can't commit and force-push the tag at once.
# Push runs only test, so each gets its own group.
concurrency:
  group: ${{ github.event_name == 'push' && format('push-{0}', github.run_id) || 'release' }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
    - name: Generate a GitHub App token
      id: app-token
      if: github.event_name != 'push'
      uses: actions/create-github-app-token@v3
      with:
        client-id: ${{ vars.APP_CLIENT_ID }}
        private-key: ${{ secrets.APP_PRIVATE_KEY }}
        permission-contents: write
    - uses: actions/checkout@v7
      with:
        # Push runs don't commit, so they don't need the app token
        token: ${{ steps.app-token.outputs.token || github.token }}
    - uses: chainguard-dev/actions/setup-gitsign@c66754a60e304cf975e46082140547262fbe76f4
      # Only needed to sign the release commit
      if: github.event_name != 'push'
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: "4.0"
        bundler-cache: true
    - name: Resolve the version
      env:
        GH_TOKEN: ${{ github.token }}
        INPUT_VERSION: ${{ github.event.inputs.version || github.event.client_payload.version }}
      run: |
        # On push, test against the latest PaperAge release
        VERSION="${INPUT_VERSION:-$(gh release view --repo matiaskorhonen/paper-age --json tagName --jq .tagName)}"
        VERSION="${VERSION#v}"
        if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::error::Invalid version: $VERSION"
          exit 1
        fi
        echo "VERSION=$VERSION" >> "$GITHUB_ENV"
    - name: Set up Homebrew
      run: |
        # Pinned to a Homebrew/install commit rather than HEAD
        NONINTERACTIVE=1 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/870ddff5dbe61d293a8b4a763090d125e59048a1/install.sh)"
        echo "/home/linuxbrew/.linuxbrew/bin" >> $GITHUB_PATH
    - name: Local Tap
      run: |
        eval "$(brew shellenv)"
        mkdir -p `brew --repo`/Library/Taps/matiaskorhonen
        ln -s `realpath ./` `brew --repo`/Library/Taps/matiaskorhonen/homebrew-paper-age
        brew trust --tap matiaskorhonen/paper-age
    - name: Update the formula
      run: ./bin/update_formula.rb "$VERSION"
    - name: Test the formula
      run: |
        eval "$(brew shellenv)"
        brew install paper-age
        brew test --debug --force paper-age
    - name: Get the GitHub App's bot user
      if: github.event_name != 'push'
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
        APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
      run: |
        BOT_USER_ID=$(gh api "/users/${APP_SLUG}%5Bbot%5D" --jq .id)
        echo "BOT_NAME=${APP_SLUG}[bot]" >> "$GITHUB_ENV"
        echo "BOT_EMAIL=${BOT_USER_ID}+${APP_SLUG}[bot]@users.noreply.github.com" >> "$GITHUB_ENV"
    - name: Add and commit
      if: github.event_name != 'push'
      uses: EndBug/add-and-commit@v11
      with:
        add: "./Formula"
        author_name: ${{ env.BOT_NAME }}
        author_email: ${{ env.BOT_EMAIL }}
        message: "Update to PaperAge v${{ env.VERSION }}"
        tag: "v${{ env.VERSION }} --force"
        tag_push: "--force"
        push: true
